{% extends "pages/base.html" %}

{% load static %}

{% block contenido %}
<div class="container-xxl flex-grow-1 container-p-y">
    <h4 class="py-3 mb-4">
        <a type="button" class="btn btn-info" style="float: right" href="{% url 'administracion:crear_banco' %}">Agregar</a>
        <span class="text-muted fw-light">Bancos /</span> Listado Bancos</h4>
    <div class="card">
        <div id="example" class="dt-container" style="margin: 20px;">
            <div class="dt-layout-row dt-layout-table">
                <div class="dt-layout-cell table-responsive text-nowrap">
                    <table id="example-table-bd" class="display  nowrap dataTable dtr-inline collapsed" style="width: 100%;" aria-describedby="example_info">
                        <thead>
                        <tr role="row">
                            <th data-dt-column="0" rowspan="1" colspan="1" class="dt-orderable-asc dt-orderable-desc" aria-label="ID: Click para ordenar" tabindex="0">
                            <span class="dt-column-title" role="button">ID</span>
                            <span class="dt-column-order"></span>
                            </th>
                            <th data-dt-column="1" rowspan="1" colspan="1" class="dt-orderable-asc dt-orderable-desc" aria-label="Nombre: Click para ordenar" tabindex="0">
                            <span class="dt-column-title" role="button">Nombre Banco</span>
                            <span class="dt-column-order"></span>
                            </th>
                            <th data-dt-column="2" class="dt-body-right dt-right dt-orderable-asc dt-orderable-desc" rowspan="1" colspan="1" tabindex="0">
                            <span class="dt-column-title" role="button">Acciones</span>
                            <span class="dt-column-order"></span>
                            </th>
                        </tr>
                        </thead>
                        <tbody>
                        {% for banco in bancos %}
                        <tr>
                            <td>
                                <i class="mdi mdi-key-variant mdi-20px text-danger me-3"></i
                                ><span class="fw-medium">{{banco.id_banco}}</span>
                            </td>
                            <td>{{banco.nombre_banco}}</td>
                            <td>
                                <div class="d-flex justify-content-evenly">
                                    <a href="{% url 'administracion:editar_banco' banco.id_banco %}">
                                        <button type="button" class="btn btn-icon btn-sm btn-outline-warning">                                          
                                            <span class="mdi mdi-pencil-outline"></span>               
                                        </button>
                                    </a>
                                    <a href="#">
                                        <button type="button" class="btn btn-icon btn-sm btn-outline-danger">
                                            <span class="mdi mdi-trash-can-outline"></span>
                                        </button>
                                    </a>
                                </div>
                            </td> 
                        </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/custom.js' %}"></script>

{% endblock contenido %}
